# Vérifie l'interface à chaque push/PR : types, règles SIKU, configuration, instructions IA à jour, build CEF.
name: ui
on: [push, pull_request]
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      # Dépôt privé siku-ui : jeton en lecture (Settings → Secrets → SIKU_UI_TOKEN, permission Contents: read)
      - run: git config --global url."https://x-access-token:${{ secrets.SIKU_UI_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx siku ai check ..
      - run: bun run build
