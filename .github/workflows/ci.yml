# siku-ui : types, règles, tests (contrastes, catalogue, échelle, CLI), build du package et de la doc,
# puis vérification de bout en bout dans une ressource générée depuis le gabarit (build Chromium 103).
name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - uses: actions/upload-artifact@v4
        with: { name: docs, path: docs/dist }
