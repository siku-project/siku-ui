# Publication d'une version : Actions → release → Run workflow (version: 1.2.0).
# Crée le tag vX.Y.Z qui CONTIENT dist/ et n'a plus de script prepare : l'installation dans une ressource
# ou une application ne télécharge ni n'exécute aucun outil de build ;
# main reste sans fichiers générés. Les ressources npm suivent via "#semver:^1.0.0", les projets Bun épinglent "#v1.2.0".
name: release
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version (semver, ex. 1.2.0)', required: true }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node -e "const f='package.json',p=require('./'+f);p.version='${{ inputs.version }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - run: grep -q "## ${{ inputs.version }}" CHANGELOG.md || (echo "Ajouter la section ## ${{ inputs.version }} au CHANGELOG" && exit 1)
      - run: bun run verify
      - run: |
          git config user.name "siku-release"; git config user.email "release@siku.local"
          git add package.json src/lib/version.ts && git commit -m "release: v${{ inputs.version }}" && git push origin HEAD:main
          git checkout -b release-tmp
          node -e "const f='package.json',p=require('./'+f);delete p.scripts.prepare;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          git add -f dist package.json && git commit -m "build: v${{ inputs.version }} (dist, sans prepare)"
          git tag v${{ inputs.version }} && git push origin v${{ inputs.version }}
      - uses: softprops/action-gh-release@v2
        with: { tag_name: 'v${{ inputs.version }}', body_path: CHANGELOG.md, files: docs/embed/siku-docs.js }
